<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Image Loop — Cinema Video Player</title>
  <style>
    :root {
      --bg: #09090f;
      --surface: #12121e;
      --purple: #a855f7;
      --blue: #3b82f6;
      --cyan: #22d3ee;
      --text: #f0f0ff;
      --text-muted: #8888aa;
      --border: rgba(255, 255, 255, 0.08);
      --gradient: linear-gradient(135deg, #a855f7 0%, #3b82f6 100%);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 14px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 20px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-left: 6px;
    }

    .status-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(34, 211, 238, 0.15);
      color: var(--cyan);
      border: 1px solid rgba(34, 211, 238, 0.3);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    .stage {
      width: 100%;
      max-width: 1040px;
      height: calc(100vh - 210px);
      background: #000000;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(168, 85, 247, 0.15);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #cinema-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      display: none;
      transition: opacity 0.08s ease;
    }

    .stage-empty {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
    }

    .stage-empty-icon {
      font-size: 54px;
      margin-bottom: 12px;
      opacity: 0.6;
    }

    .stage-empty-title {
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 6px;
    }

    .badge-overlay {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(18, 18, 30, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--cyan);
      font-size: 12px;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      letter-spacing: 0.5px;
    }

    .controls-wrapper {
      width: 100%;
      max-width: 1040px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .scrubber {
      width: 100%;
      height: 6px;
      background: var(--surface);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      accent-color: var(--purple);
    }

    .controls-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      padding: 10px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .c-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .c-btn:hover {
      background: rgba(168, 85, 247, 0.2);
      border-color: var(--purple);
    }

    .c-play-btn {
      background: var(--gradient);
      border-color: transparent;
      padding: 7px 22px;
      font-size: 14px;
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.4);
    }

    .c-play-btn:hover {
      opacity: 0.95;
      transform: scale(1.02);
    }

    .fps-select {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 8px;
      outline: none;
      cursor: pointer;
    }

    .meta-text {
      font-size: 12px;
      color: var(--text-muted);
      max-width: 450px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-icon">🎬</span>
      <span class="brand-title">AI Video Cinema</span>
      <span class="brand-sub">Frame-by-Frame Continuous Motion Player</span>
    </div>
    <div class="status-pill" id="live-indicator">● LIVE SYNC</div>
  </header>

  <main>
    <div class="stage" id="stage">
      <img id="cinema-img" src="" alt="Cinema Video Frame" />
      <div class="stage-empty" id="stage-empty">
        <div class="stage-empty-icon">🎬</div>
        <div class="stage-empty-title">Waiting for generated frames…</div>
        <div>Start the AI Image Loop in your extension popup to stream live frames into this player!</div>
      </div>
      <div class="badge-overlay" id="badge-overlay">Frame 0/0</div>
    </div>

    <div class="controls-wrapper">
      <input type="range" class="scrubber" id="scrubber" min="0" max="0" value="0" />

      <div class="controls-bar">
        <div class="btn-group">
          <button class="c-btn" id="btn-prev" title="Previous Frame (Left Arrow)">⏮️ Prev</button>
          <button class="c-btn c-play-btn" id="btn-play" title="Play / Pause (Spacebar)">▶️ Play</button>
          <button class="c-btn" id="btn-next" title="Next Frame (Right Arrow)">Next ⏭️</button>
        </div>

        <div class="meta-text" id="meta-text">No active frame</div>

        <div class="btn-group">
          <label style="font-size: 12px; color: var(--text-muted); font-weight: 600;">Speed:</label>
          <select class="fps-select" id="fps-select">
            <option value="1">1 FPS</option>
            <option value="2">2 FPS</option>
            <option value="3">3 FPS</option>
            <option value="4" selected>4 FPS (Motion)</option>
            <option value="6">6 FPS</option>
            <option value="8">8 FPS</option>
            <option value="12">12 FPS (Fluid)</option>
          </select>
          <button class="c-btn" id="btn-fullscreen" title="Toggle Fullscreen (F)">⛶ Fullscreen</button>
        </div>
      </div>
    </div>
  </main>

  <script src="player.js"></script>
</body>
</html>
